<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App con Pestañas y Feed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navegación Superior -->
  <nav class="navbar">
    <button class="nav-btn active" data-target="screen-para-ti">Para ti</button>
    <button class="nav-btn" data-target="screen-descubrir">Descubrir</button>
    <button class="nav-btn" data-target="screen-internacional">Internacional</button>
    <button class="nav-btn" data-target="screen-crear">Crear</button>
  </nav>

  <!-- Contenedor Principal de Pantallas -->
  <main class="main-content">
    
    <!-- Pantalla 1: Para ti -->
    <section id="screen-para-ti" class="screen-content active">
      <h2>Feed Para Ti</h2>
      <div id="para-ti-feed" class="feed-grid">
        <!-- Las publicaciones se insertarán aquí dinámicamente -->
      </div>
    </section>

    <!-- Pantalla 2: Descubrir -->
    <section id="screen-descubrir" class="screen-content hidden">
      <h2>Descubrir</h2>
      <p>Contenido sugerido y tendencias actuales.</p>
    </section>

    <!-- Pantalla 3: Internacional -->
    <section id="screen-internacional" class="screen-content hidden">
      <h2>Internacional</h2>
      <p>Novedades y tendencias globales.</p>
    </section>

    <!-- Pantalla 4: Crear Publicación -->
    <section id="screen-crear" class="screen-content hidden">
      <h2>Nueva Publicación</h2>
      <form id="create-post-form" class="create-form">
        <label for="post-image-input">Selecciona una imagen:</label>
        <input type="file" id="post-image-input" accept="image/*" required>
        <button type="submit" class="submit-btn">Publicar</button>
      </form>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
